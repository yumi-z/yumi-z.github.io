/* ===== 2. Helpers ===== */

let typed = false;

/* GH-SHIM-START: GitHub-backed storage. Content lives in data/site.json, uploaded files in uploads/ */
const GH = (() => { const h = location.hostname; if (h.endsWith(".github.io")) { const seg = location.pathname.split("/")[1] || ""; return { owner: h.split(".")[0], repo: seg && !seg.includes(".") ? seg : h }; } return { owner: "yumi-z", repo: "yumi-z.github.io" }; })();
let TOKEN = null, site = { docs: {}, portfolio: [] }, siteSha = null;

const fixSite = () => { site.docs = site.docs || {}; site.portfolio = site.portfolio || []; };

  const send = () => gh("PUT", "data/site.json", { message: "Update site content", content: b64(new TextEncoder().encode(JSON.stringify(site, null, 2))), sha: siteSha || undefined });
  let r = await send();
  if (r.status === 409 || r.status === 422) { const g = await gh("GET", "data/site.json"); if (g.ok) siteSha = (await g.json()).sha; r = await send(); }

  siteSha = (await r.json()).content.sha;

async function mutate(fn) { if (!TOKEN) throw new Error("Unlock editing first."); const snap = JSON.stringify(site); fn(); notify(); try { await commit(); } catch (e) { site = JSON.parse(snap); notify(); throw e; } }
const ghDb = {
  doc(path) { const [col, id] = path.split("/"); return {
    onSnapshot(cb) { const f = () => { const d = site.docs[id]; cb({ exists: !!d, data: () => d }); }; subs.push(f); f(); },
    set: data => mutate(() => { site.docs[id] = data; }),
    delete: () => mutate(() => { site.portfolio = site.portfolio.filter(x => x.id !== id); }) }; },
  collection() { return { orderBy() { return this; },
    onSnapshot(cb) { const f = () => cb({ docs: [...site.portfolio].sort((a, b) => b.created - a.created).map(x => ({ id: x.id, data: () => x })) }); subs.push(f); f(); },
    add: d => mutate(() => { site.portfolio.unshift({ id: uid(), ...d }); }) }; }
};
const ghAssets = {
  async upload(file) {
    if (!TOKEN) throw new Error("Unlock editing first.");
    const name = "uploads/" + Date.now() + "-" + file.name.replace(/[^\w.\-]+/g, "_");
    const r = await gh("PUT", name, { message: "Upload " + name, content: b64(new Uint8Array(await file.arrayBuffer())) });
    if (!r.ok) throw new Error("Upload failed (GitHub " + r.status + ")");

  },
  async delete(id) { const m = await gh("GET", id); if (!m.ok) return; await gh("DELETE", id, { message: "Delete " + id, sha: (await m.json()).sha }); }
};
const getStored = () => { try { return localStorage.getItem("gh_token"); } catch { return null; } };
async function verify(tok) { try { const r = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}`, { headers: { Authorization: "Bearer " + tok, Accept: "application/vnd.github+json" } }); if (!r.ok) return false; const j = await r.json(); return !!(j.permissions && j.permissions.push); } catch { return false; } }

  if (!(await verify(tok))) return false;
  TOKEN = tok; unlocked = true; if (remember) try { localStorage.setItem("gh_token", tok); } catch {}
  await refreshFromApi(); render(); return true;
}
/* GH-SHIM-END */

/* ===== 3. State ===== */
let db = ghDb, assets = ghAssets, unlocked = false, tab = "intro", cat = "All", resume = null, items = [], busy = false;
try { tab = localStorage.getItem("tab") || "intro"; } catch {}

/* ===== editable sections (saved in db, editable only when unlocked) ===== */
const DEF = {
  skills: SITE.skills.map(([g, l]) => ({ g, l })),
  courses: SITE.courses,
  hobbies: SITE.hobbies.map(([i, n, d]) => ({ i, n, d })),
  favs: [
    { g: "Movies", l: ["Movie title 1", "Movie title 2", "Movie title 3"] },
    { g: "TV Shows", l: ["Show title 1", "Show title 2"] },
    { g: "Music", l: ["Artist 1", "Artist 2", "Artist 3"] },
    { g: "Games", l: ["Game 1", "Game 2"] },
    { g: "Books", l: ["Book 1", "Book 2"] },
    { g: "Currently into", l: ["Whatever you’re obsessed with right now"] }
  ]
};
const DATA = {};
const get = k => DATA[k] || DEF[k];
async function save(k, arr) { if (!db) return toast("Database unavailable."); try { await db.doc("site/" + k).set({ items: arr }); toast("Saved"); } catch { toast("Could not save. Is your token still valid?"); } }
const edit = (k, fn) => { const a = structuredClone(get(k)); fn(a); save(k, a); };
const delBtn = fn => h("button", { class: "x", title: "Delete", onclick: () => dialog("Delete this item?").then(ok => ok && fn()) }, "✕");
function addForm(k, fields, make) {
  const ins = fields.map(p => h("input", { placeholder: p }));
  const b = h("button", { class: "btn pri" }, "Add");
  b.onclick = () => { const v = ins.map(i => i.value.trim()); if (!v[0] || !v[1]) return toast("Fill in the first two fields."); edit(k, a => a.unshift(make(v))); };
  return h("div", { class: "card admin" }, h("div", { class: "row" }, ins.map(i => h("div", { style: "flex:1;min-width:150px" }, i)), b));
}
let editingIntro = false;
function introView() {
  const text = DATA.intro && DATA.intro.text != null ? DATA.intro.text : SITE.intro, card = h("div", { class: "card" });
  if (editingIntro && unlocked) {
    const ta = h("textarea", { rows: 8 }); ta.value = text;
    card.append(ta, h("div", { class: "row", style: "margin-top:10px" },
      h("button", { class: "btn pri", onclick: async () => { try { await db.doc("site/intro").set({ text: ta.value.trim() }); editingIntro = false; toast("Saved"); } catch { toast("Could not save. Is your token still valid?"); } render(); } }, "Save"),

    if (unlocked) card.append(h("button", { class: "btn", style: "font-size:12px;padding:4px 10px", onclick: () => { editingIntro = true; render(); } }, "✎ Edit text"));
  }

}
async function editEmail() {
  const v = await dialog("Email address shown on your site", { input: true, secret: false, value: (DATA.contact && DATA.contact.email) || SITE.email });
  if (v == null) return;
  try { await db.doc("site/contact").set({ email: v.trim() }); toast("Saved"); } catch { toast("Could not save. Is your token still valid?"); }
}
function photoBox() {
  const ph = DATA.photo, wrap = h("div", { class: "photowrap" }, h("div", { class: "photo" }, ph && ph.url ? h("img", { src: ph.url, alt: "Photo" }) : h("span", {}, "👤")));
  if (unlocked) {

      const file = f.files[0]; if (!file) return; if (!file.type.startsWith("image/")) throw new Error("Please choose an image.");
      const r = await upload(file); const old = ph && ph.assetId;
      await db.doc("site/photo").set({ assetId: r.id, url: r.url }); await removeAsset(old); toast("Photo updated");

}
function skillsView() { return groupsView("skills"); }
function groupsView(key) {

  arr.forEach((grp, gi) => {
    const tags = h("div", {}, grp.l.map((s, si) => h("span", { class: "tag" }, s, unlocked && h("button", { class: "x", title: "Remove", onclick: () => edit(key, a => a[gi].l.splice(si, 1)) }, "×"))));

let courseSchool = "All";
function courseForm(schools) {
  const code = h("input", { placeholder: "e.g. CS 61A" }), name = h("input", { placeholder: "Course name" }), school = h("input", { placeholder: "School / university", list: "schools" }),

function courseView() {
  const arr = get("courses"), schools = [...new Set(arr.map(c => c.school).filter(Boolean))];
  if (courseSchool !== "All" && !schools.includes(courseSchool)) courseSchool = "All";

const editingText = {};
function blurb(key, def) {
  const text = DATA[key] && DATA[key].text != null ? DATA[key].text : def, card = h("div", { class: "card" });
  if (editingText[key] && unlocked) {
    const ta = h("textarea", { rows: 6 }); ta.value = text;
    card.append(ta, h("div", { class: "row", style: "margin-top:10px" },
      h("button", { class: "btn pri", onclick: async () => { try { await db.doc("site/" + key).set({ text: ta.value.trim() }); editingText[key] = false; toast("Saved"); } catch { toast("Could not save. Is your token still valid?"); } render(); } }, "Save"),
      h("button", { class: "btn", onclick: () => { editingText[key] = false; render(); } }, "Cancel")));
  } else {
    text.split(/\n\s*\n/).filter(x => x.trim()).forEach(t => card.append(h("p", {}, t)));
    if (unlocked) card.append(h("button", { class: "btn", style: "font-size:12px;padding:4px 10px", onclick: () => { editingText[key] = true; render(); } }, "✎ Edit text"));

}
function hobbyView() {
  return h("div", {}, head("", "Interests", null), h("div", { style: "height:14px" }),
    h("h2", { style: "margin-top:0" }, "Hobbies"), blurb("hobbytext", "Write a few lines about what you do for fun and what you’re into lately."),
    h("h2", {}, "Favorites"), groupsView("favs"),
    h("div", { class: "row", style: "margin-top:28px" }, h("a", { class: "btn", href: "https://myanimelist.net/profile/yumi-z", target: "_blank", rel: "noopener" }, "My Anime List ↗")));
}

/* in-page dialog (replaces prompt/confirm, which sandboxed pages may block) */
function dialog(msg, { input = false, secret = true, value = "", remember = false } = {}) {
  return new Promise(res => {
    const d = $("#dlg"), i = $("#din"); $("#dmsg").textContent = msg; i.style.display = input ? "" : "none"; i.value = value; i.type = secret ? "password" : "text"; $("#drow").style.display = remember ? "" : "none"; $("#dchk").checked = false;
    const done = v => { d.classList.remove("on"); $("#dyes").onclick = $("#dno").onclick = i.onkeydown = null; res(v); };
    $("#dyes").onclick = () => done(input ? i.value : true);
    $("#dno").onclick = () => done(input ? null : false);
    i.onkeydown = e => { if (e.key === "Enter") $("#dyes").click(); };
    d.classList.add("on"); if (input) i.focus();
  });
}

/* ===== 4. Password gate ===== */
async function toggleLock() {
  if (unlocked) { unlocked = false; TOKEN = null; try { localStorage.removeItem("gh_token"); } catch {} render(); return toast("Locked"); }
  const t = await dialog("Paste your GitHub token to enable editing", { input: true, remember: true });
  if (!t || !t.trim()) return;
  toast("Checking token…");
  if (!(await unlockWith(t.trim(), $("#dchk").checked))) return toast("That token doesn’t work for this repository.");
  toast("Unlocked");
}

/* ===== 5. Upload logic ===== */
async function upload(file) {
  if (!assets) throw new Error("File storage is only available to the page owner.");
  if (file.size > 20 * 1024 * 1024) throw new Error("File is over 20 MB.");
  return assets.upload(file);
}
async function removeAsset(id) { try { if (id && assets) await assets.delete(id); } catch {} }
async function run(btn, fn) {
  if (busy) return; busy = true; const old = btn.textContent; btn.textContent = "Uploading…"; btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message || "Something went wrong"); }
  busy = false; btn.textContent = old; btn.disabled = false;
}

/* ===== 6. Views ===== */
const views = {
  intro: () => h("div", {},
    h("div", { class: "hero" }, head("About", "", null, "tw"), photoBox()),
    introView(),
    h("div", { style: "margin-top:26px" }, skillsView()),
    h("div", { style: "margin-top:26px" }, h("p", { style: "margin:0 0 12px" }, h("span", { class: "mono", style: "color:var(--mute)" }, "Email  "), (DATA.contact && DATA.contact.email) || SITE.email, unlocked && h("button", { class: "x", style: "margin-left:10px", onclick: editEmail }, "✎ edit")),
      h("div", { class: "row" }, SITE.links.map(([n, u]) => h("a", { class: "btn", href: u, target: "_blank", rel: "noopener" }, n))))),

  course: courseView,

  resume() {
    const box = h("div", {}, head("", "Resume", null), h("div", { style: "height:14px" }));
    if (unlocked) {
      const f = h("input", { type: "file", accept: ".pdf,.doc,.docx,application/pdf" });
      const b = h("button", { class: "btn pri", style: "margin-top:12px" }, "Upload & replace");
      b.onclick = () => run(b, async () => {
        const file = f.files[0]; if (!file) throw new Error("Choose a file first.");
        const r = await upload(file); const oldId = resume?.assetId;
        await db.doc("site/resume").set({ assetId: r.id, url: r.url, name: file.name, type: file.type, updated: Date.now() });
        await removeAsset(oldId); toast("Resume updated");
      });
      box.append(h("div", { class: "card admin" }, h("strong", {}, "🔓 Replace resume"), h("label", {}, "PDF recommended. The old file is replaced."), f, b));
    }
    if (!resume) { box.append(h("div", { class: "empty" }, "No resume uploaded yet.")); return box; }
    box.append(h("div", { class: "row" }, h("a", { class: "btn pri", href: resume.url, download: resume.name }, "Download"), h("span", { class: "meta" }, resume.name + " · updated " + fmt(resume.updated))));

    if (unlocked) box.append(uploadForm());

      h("button", { class: "chip" + (c === cat ? " on" : ""), onclick: () => { cat = c; render(); } }, c))));
    const list = items.filter(i => cat === "All" || i.cat === cat);

/* PDF rendering with pdf.js (works without browser PDF plugin) */
let pdfLib = null;
function loadPdf() {
  return pdfLib || (pdfLib = new Promise((res, rej) => {
    const sc = h("script", { src: "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" });
    sc.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(pdfjsLib); };
    sc.onerror = () => { pdfLib = null; rej(new Error("pdf.js failed to load")); };
    document.head.append(sc);
  }));
}
async function openPdf(url) { return (await loadPdf()).getDocument(url).promise; }
async function drawPage(doc, n, cv, w) {
  const pg = await doc.getPage(n), v0 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: (w / v0.width) * (devicePixelRatio || 1) });
  cv.width = vp.width; cv.height = vp.height; cv.style.width = "100%";
  await pg.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
}
async function thumb(cv, url) { await drawPage(await openPdf(url), 1, cv, 420); }
async function pdfPages(box, url, max, w) {
  try { const d = await openPdf(url); for (let n = 1; n <= Math.min(d.numPages, max); n++) { const cv = h("canvas", {}); box.append(cv); await drawPage(d, n, cv, w); } }
  catch { box.replaceChildren(h("div", { class: "empty" }, "Preview unavailable.")); }
}
function viewPdf(url) { const b = $("#vbody"); b.replaceChildren(); $("#viewer").classList.add("on"); pdfPages(b, url, 40, 900); }

function uploadForm() {
  const title = h("input", { placeholder: "Title" }), desc = h("textarea", { rows: 2, placeholder: "Short description (optional)" });
  const sel = h("select", {}, SITE.categories.map(c => h("option", {}, c)));
  const file = h("input", { type: "file", accept: "image/*,video/*,.pdf" }), url = h("input", { placeholder: "https://…" });
  const fw = h("div", {}, h("label", {}, "File (image / video / PDF, max 20 MB)"), file), uw = h("div", { style: "display:none" }, h("label", {}, "Link URL"), url);
  const mode = h("select", { onchange: () => { fw.style.display = mode.value === "file" ? "" : "none"; uw.style.display = mode.value === "url" ? "" : "none"; } },
    h("option", { value: "file" }, "Upload a file"), h("option", { value: "url" }, "Add a link"));
  const b = h("button", { class: "btn pri", style: "margin-top:14px" }, "Add to portfolio");
  b.onclick = () => run(b, async () => {
    if (!title.value.trim()) throw new Error("Please enter a title.");
    const doc = { title: title.value.trim(), cat: sel.value, desc: desc.value.trim(), created: Date.now() };
    if (mode.value === "url") { const u = safeUrl(url.value.trim()); if (!u) throw new Error("Enter a valid http(s) URL."); Object.assign(doc, { kind: "link", url: u }); }
    else { const fl = file.files[0]; if (!fl) throw new Error("Choose a file."); const r = await upload(fl); Object.assign(doc, { kind: kindOf(fl), url: r.url, assetId: r.id, fileName: fl.name }); }
    await db.collection("portfolio").add(doc); toast("Added: " + doc.title);
  });
  return h("div", { class: "card admin" }, h("strong", {}, "🔓 Add new work"),
    h("label", {}, "Title"), title, h("label", {}, "Category"), sel, h("label", {}, "Description"), desc, h("label", {}, "Type"), mode, fw, uw, b);
}

function card(i) {
  const m = h("div", { class: "media" });
  if (i.kind === "image") m.append(h("img", { src: i.url, alt: i.title, loading: "lazy" }));
  else if (i.kind === "video") m.append(h("video", { src: i.url, controls: "", preload: "metadata" }));
  else if (i.kind === "pdf") { const cv = h("canvas", {}); m.append(cv); m.style.cssText = "align-items:flex-start;cursor:pointer"; m.title = "Click to view"; m.onclick = () => viewPdf(i.url); thumb(cv, i.url).catch(() => m.replaceChildren("📄")); }
  else m.textContent = i.kind === "link" ? "🔗" : "📎";
  const acts = h("div", { class: "row", style: "margin-top:auto;padding-top:8px" });
  if (i.kind === "pdf") acts.append(h("button", { class: "btn", onclick: () => viewPdf(i.url) }, "View"));
  else if (i.kind !== "video") acts.append(h("a", { class: "btn", href: i.url, target: "_blank", rel: "noopener" }, i.kind === "link" ? "Visit ↗" : "Open"));
  if (unlocked) acts.append(h("button", { class: "btn del", onclick: async () => {
    if (!await dialog("Delete “" + i.title + "”?")) return;
    try { await db.doc("portfolio/" + i.id).delete(); await removeAsset(i.assetId); toast("Deleted"); } catch { toast("Delete failed"); } } }, "Delete"));
  return h("div", { class: "card item" }, m, h("div", { class: "body" }, h("span", { class: "tag", style: "align-self:flex-start;margin:0" }, i.cat),
    h("h3", {}, i.title), i.desc && h("p", {}, i.desc), h("span", { class: "meta" }, fmt(i.created)), acts));
}

/* ===== 7. Render & boot ===== */
function go(k) { tab = k; try { localStorage.setItem("tab", k); } catch {} render(); scrollTo(0, 0); }
function render() {
  $("#brand").textContent = "~/" + SITE.handle;
  $("#lock").textContent = unlocked ? "🔓 Lock" : "🔒 Edit";
  $("#nav").replaceChildren(...TABS.map(([k, n], i) => h("button", { class: k === tab ? "on" : "", onclick: () => go(k) }, h("span", { class: "k" }, i + 1), n)));
  if (!views[tab]) tab = "intro";
  $("#view").replaceChildren(views[tab]());
  $("#foot").replaceChildren(h("span", {}, "Built with HTML · CSS · JS, hosted on GitHub Pages"), h("span", {}, h("kbd", {}, "1–5"), " switch  ", h("kbd", {}, "/"), " search"), h("span", {}, "Last updated " + SITE.updated));
  typewrite();
}
$("#lock").onclick = toggleLock;

/* theme toggle */
const root = document.documentElement;
function setTheme(t) { root.dataset.theme = t; $("#theme").textContent = t === "dark" ? "☀" : "☾"; try { localStorage.setItem("theme", t); } catch {} }
let th; try { th = localStorage.getItem("theme"); } catch {}
setTheme(th || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light"));
$("#theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

/* command palette + keyboard shortcuts */
const pal = $("#pal"), pin = $("#pin"), plist = $("#plist"); let psel = 0, pm = [];
function palList() { const q = pin.value.toLowerCase(); pm = TABS.filter(([k, n]) => (k + n).toLowerCase().includes(q)); psel = 0;
  plist.replaceChildren(...pm.map(([k, n], i) => h("div", { class: "opt" + (i === 0 ? " sel" : ""), onclick: () => { palClose(); go(k); } }, n, h("span", { class: "meta" }, "~/" + k)))); }
function palOpen() { pal.classList.add("on"); pin.value = ""; palList(); pin.focus(); }
function palClose() { pal.classList.remove("on"); pin.blur(); }
pin.oninput = palList;
pin.onkeydown = e => { if (e.key === "Enter" && pm[psel]) { palClose(); go(pm[psel][0]); } };
pal.onclick = e => { if (e.target === pal) palClose(); };
const vw = $("#viewer"), vclose = () => vw.classList.remove("on"); $("#vclose").onclick = vclose; vw.onclick = e => { if (e.target === vw || e.target.id === "vbody") vclose(); };
addEventListener("keydown", e => {
  if (e.key === "Escape") { $("#dno").click(); vclose(); return palClose(); }
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/") { e.preventDefault(); return palOpen(); }
  const i = +e.key - 1; if (i >= 0 && i < TABS.length) go(TABS[i][0]);
});

render();

(async () => {
  await loadSite();
  for (const k of ["skills", "courses", "hobbies", "favs"]) db.doc("site/" + k).onSnapshot(s => { if (s.exists) DATA[k] = s.data().items; render(); });
  db.doc("site/photo").onSnapshot(s => { DATA.photo = s.exists ? s.data() : null; render(); });
  db.doc("site/intro").onSnapshot(s => { DATA.intro = s.exists ? s.data() : null; render(); });
  db.doc("site/contact").onSnapshot(s => { DATA.contact = s.exists ? s.data() : null; render(); });
  db.doc("site/hobbytext").onSnapshot(s => { DATA.hobbytext = s.exists ? s.data() : null; render(); });
  db.doc("site/resume").onSnapshot(s => { resume = s.exists ? s.data() : null; render(); });
  db.collection("portfolio").orderBy("created", "desc").onSnapshot(q => { items = q.docs.map(d => ({ id: d.id, ...d.data() })); render(); });
  const st = getStored(); if (st) unlockWith(st, false).then(ok => { if (!ok) try { localStorage.removeItem("gh_token"); } catch {} });
})();
